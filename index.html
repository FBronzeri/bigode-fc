<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bigode FC · Gestão Financeira</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f4ee;--cd:#fff;--tx:#111;--mu:#666;--ln:#e4e0d2;--gd:#f59e0b;--ac:#b45309;--pos:#15803d;--rd:#dc2626;--in:#fffaea;color-scheme:light;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--cd:#161b22;--tx:#e6edf3;--mu:#8b949e;--ln:#30363d;--ac:#fbbf24;--pos:#34d399;--rd:#f87171;--in:#0d1117;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--cd:#161b22;--tx:#e6edf3;--mu:#8b949e;--ln:#30363d;--ac:#fbbf24;--pos:#34d399;--rd:#f87171;--in:#0d1117;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.hd{background:#161b22;border-bottom:1px solid #30363d;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;position:sticky;top:0;z-index:5}
.hi{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd img{height:56px;width:auto}.hd .t{flex:1;min-width:150px}
h1{font:700 26px/1 Teko,Impact,sans-serif;letter-spacing:1px;margin:0;color:#fff}
h1 b{font:800 11px Inter,sans-serif;background:var(--gd);color:#000;padding:2px 7px;border-radius:6px;letter-spacing:0;vertical-align:middle;margin-left:6px}
.hd small{color:#8b949e}.pill{display:flex;align-items:center;gap:7px;background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:6px 10px;font-size:12px;color:#c9d1d9}
.dot{width:9px;height:9px;border-radius:50%;background:#34d399}.dot.off{background:#fbbf24}
.hd input{background:#0d1117;color:#fbbf24;border-color:#30363d;font-weight:600}
nav{max-width:1100px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:12px 16px 0;border-bottom:1px solid var(--ln)}
nav button{white-space:nowrap;border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--gd)}
main{max-width:1100px;margin:auto;padding:16px 16px 60px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}.g.s{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.k{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;position:relative}
.k small{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.k b{display:block;font-size:24px;margin:4px 0 2px;font-weight:800}.g.s .k b{font-size:17px}.k i{position:absolute;right:12px;top:10px;font-style:normal;font-size:20px;background:rgba(245,158,11,.15);border-radius:10px;padding:4px 7px}
.k p{margin:0;color:var(--mu);font-size:12px}
.k small{padding-right:34px}
.neg{color:var(--rd)}.pos{color:var(--pos)}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.c h3{margin:0 0 10px;font:700 21px Teko,Impact,sans-serif;letter-spacing:.5px;color:var(--ac)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cv{height:260px}.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}th{font-size:11px;color:var(--mu);text-transform:uppercase}
input,select,button.b{box-sizing:border-box;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--ln);border-radius:9px;padding:8px}
button.b{background:var(--gd);color:#000;font-weight:700;border:0;cursor:pointer}
form,.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}form input,form select,.row input,.row select{flex:1 1 140px;min-width:0}
.tg{display:flex;gap:6px;flex:1 1 100%}.tg label{flex:1;text-align:center;border:1px solid var(--ln);border-radius:9px;padding:8px;cursor:pointer}.tg input{display:none}.tg label:has(input:checked){background:var(--gd);color:#000;font-weight:700;border-color:var(--gd)}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}
.bar{height:6px;background:var(--ln);border-radius:4px;margin-top:5px}.bar i{display:block;height:100%;background:var(--gd);border-radius:4px}.bar i.o{background:var(--rd)}
.x{border:0;background:none;color:var(--rd);cursor:pointer;font:inherit;font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700}.tag.e{background:rgba(52,211,153,.15);color:var(--pos)}.tag.s{background:rgba(248,113,113,.15);color:var(--rd)}
.pm{padding:3px 11px;font-size:16px;line-height:1}
label small{display:block;margin-bottom:3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#000;color:#fff;border:1px solid var(--gd);padding:10px 16px;border-radius:10px;z-index:9;display:none}
</style></head><body>
